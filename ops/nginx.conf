server {
    listen 80;
    listen [::]:80;
    server_name eduardomelo.dev www.eduardomelo.dev;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://eduardomelo.dev$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name eduardomelo.dev www.eduardomelo.dev;
    ssl_certificate /etc/letsencrypt/live/eduardomelo.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduardomelo.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    access_log off;
    error_log /var/log/nginx/portfolio-error.log crit;
    client_max_body_size 1m;
    if ($host = www.eduardomelo.dev) { return 308 https://eduardomelo.dev$request_uri; }
    location / {
        proxy_pass http://127.0.0.1:18182;
        proxy_http_version 1.1;
        proxy_set_header Host eduardomelo.dev;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host eduardomelo.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
